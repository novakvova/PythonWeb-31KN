{% extends "layout.html" %}

{% block content %}

<div class="d-flex justify-content-center align-items-center">

    <div class="container">
        <div class="row justify-content-center">

            <div class="col-lg-8 col-xl-7">

                <div class="card shadow-lg p-4">

                    <div class="card-header text-center bg-white border-0">
                        <div class="mb-3">
                            <i class="bi bi-envelope-check text-success" style="font-size: 4rem;"></i>
                        </div>
                        <h2 class="fw-bold">Перевірте пошту</h2>
                    </div>

                    <div class="card-body text-center">

                        <p class="text-secondary mb-4">
                            Якщо вказана пошта зареєстрована в системі,
                            на неї надіслано посилання для відновлення пароля.
                        </p>

                        <p class="text-secondary small mb-4">
                            Перевірте папку «Спам», якщо лист не надійшов
                            протягом кількох хвилин.
                        </p>

                        <a href="{% url 'users:login' %}"
                           class="btn btn-primary btn-lg w-100">
                            Повернутися до входу
                        </a>

                    </div>

                </div>

            </div>

        </div>
    </div>

</div>

{% endblock %}
